<script>
const allProjectsData = [{"BioProject":"PRJNA123456","Type":"metagenome","country":"China","tissue":"Feces","disease":"Healthy","PMID":30000001,"sampleCount":3},{"BioProject":"PRJNA789012","Type":"metagenome","country":"UK","tissue":"Saliva","disease":"Caries","PMID":30000002,"sampleCount":3},{"BioProject":"PRJNA345678","Type":"metagenome","country":"India","tissue":"Stool","disease":"IBD","PMID":30000003,"sampleCount":3},{"BioProject":"PRJNA901234","Type":"metagenome","country":"Germany","tissue":"Skin","disease":"Atopic_dermatitis","PMID":30000004,"sampleCount":2},{"BioProject":"PRJNA567890","Type":"metatranscriptome","country":"Brazil","tissue":"Blood","disease":"Sepsis","PMID":30000005,"sampleCount":3},{"BioProject":"PRJNA678901","Type":"metatranscriptome","country":"South Africa","tissue":"Sputum","disease":"Tuberculosis","PMID":30000006,"sampleCount":3},{"BioProject":"PRJNA112233","Type":"metagenome","country":"Japan","tissue":"Gut","disease":"Diabetes","PMID":30000007,"sampleCount":3},{"BioProject":"PRJNA445566","Type":"metatranscriptome","country":"Australia","tissue":"Nasal_swab","disease":"COVID19","PMID":30000008,"sampleCount":3},{"BioProject":"PRJNA998877","Type":"metagenome","country":"Canada","tissue":"Milk","disease":"Mastitis","PMID":30000009,"sampleCount":2},{"BioProject":"PRJNA665544","Type":"metatranscriptome","country":"Egypt","tissue":"Urine","disease":"UTI","PMID":30000010,"sampleCount":3},{"BioProject":"PRJNA334455","Type":"metagenome","country":"Mexico","tissue":"Vaginal_swab","disease":"BV","PMID":30000011,"sampleCount":2}];

let currentPage = 1;
let totalPages = 1;
let matchedProjects = [];
const pageSize = 12;

const projectsContainer = document.getElementById('projectsGrid');
const typeFilter = document.getElementById('typeFilter');
const countryFilter = document.getElementById('countryFilter');
const tissueFilter = document.getElementById('tissueFilter');
const diseaseFilter = document.getElementById('diseaseFilter');
const searchInput = document.getElementById('searchInput');
const resultsCountSpan = document.getElementById('resultsCount');
const firstPageBtn = document.getElementById('firstPageBtn');
const prevPageBtn = document.getElementById('prevPageBtn');
const nextPageBtn = document.getElementById('nextPageBtn');
const lastPageBtn = document.getElementById('lastPageBtn');
const jumpPageInput = document.getElementById('jumpPageInput');
const jumpPageBtn = document.getElementById('jumpPageBtn');
const currentPageSpan = document.getElementById('currentPageDisplay');
const totalPagesSpan = document.getElementById('totalPagesDisplay');

function renderProjects(projects) {
  if (!projects.length) {
    projectsContainer.innerHTML = '<div class="col-span-full text-center py-8 text-gray-500">No projects match your filters.</div>';
    return;
  }
  let html = '';
  projects.forEach(proj => {
    let typeBadge = '';
    if (proj.Type === 'metagenome') typeBadge = '<div class="badge badge-primary badge-md">metagenome</div>';
    else if (proj.Type === 'metatranscriptome') typeBadge = '<div class="badge badge-secondary badge-md">metatranscriptome</div>';
    else typeBadge = '<div class="badge badge-ghost badge-md">' + (proj.Type || 'Unknown') + '</div>';

    const bpLink = `https://www.ncbi.nlm.nih.gov/bioproject/?term=${proj.BioProject}`;
    const pmidHtml = proj.PMID ? `
      <div class="flex items-center gap-2 text-sm mb-2">
        <i class="fa-solid fa-book text-base-content/60 w-4"></i>
        <span class="font-semibold">PMID:</span>
        <a href="https://pubmed.ncbi.nlm.nih.gov/${proj.PMID}" target="_blank" rel="noopener noreferrer" class="link link-accent">${proj.PMID}</a>
      </div>
    ` : '';

    html += `
      <div class="card glass rounded-box shadow-lg bg-base-100 overflow-hidden hover:shadow-xl hover:scale-105 transition-all duration-300">
        <div class="card-body relative">
          <div class="absolute top-4 right-4">
            ${typeBadge}
          </div>
          <h2 class="card-title text-xl font-bold mb-3 flex items-center">
            <i class="fa-solid fa-folder-tree text-primary mr-2"></i>
            <a href="${bpLink}" target="_blank" rel="noopener noreferrer" class="hover:text-primary transition-colors no-underline">
              ${proj.BioProject}
            </a>
          </h2>
          <div class="flex items-center gap-2 text-sm mb-2">
            <i class="fa-solid fa-database text-base-content/60 w-4"></i>
            <span class="font-semibold">Samples:</span>
            <span>${proj.sampleCount} SRR runs</span>
          </div>
          <div class="flex items-center gap-2 text-sm mb-2">
            <i class="fa-solid fa-location-dot text-base-content/60 w-4"></i>
            <span class="font-semibold">Country:</span>
            <span>${proj.country || '-'}</span>
          </div>
          <div class="flex items-center gap-2 text-sm mb-2">
            <i class="fa-solid fa-flask text-base-content/60 w-4"></i>
            <span class="font-semibold">Source:</span>
            <span>${proj.tissue || '-'}</span>
          </div>
          <div class="flex items-center gap-2 text-sm mb-2">
            <i class="fa-solid fa-stethoscope text-base-content/60 w-4"></i>
            <span class="font-semibold">Disease:</span>
            <span>${proj.disease || '-'}</span>
          </div>
          ${pmidHtml}
          <div class="mt-4 flex justify-end">
            <a href="javascript:goToSample('${proj.BioProject}')" class="btn btn-primary btn-sm">
              View Samples <i class="fa-solid fa-arrow-right ml-1"></i>
            </a>
          </div>
        </div>
      </div>
    `;
  });
  projectsContainer.innerHTML = html;
}

function filterProjects() {
  const typeVal = typeFilter.value;
  const countryVal = countryFilter.value;
  const tissueVal = tissueFilter.value;
  const diseaseVal = diseaseFilter.value;
  const searchVal = searchInput.value.trim().toLowerCase();

  matchedProjects = allProjectsData.filter(proj => {
    const matchType = !typeVal || proj.Type === typeVal;
    const matchCountry = !countryVal || proj.country === countryVal;
    const matchTissue = !tissueVal || proj.tissue === tissueVal;
    const matchDisease = !diseaseVal || proj.disease === diseaseVal;
    const matchSearch = !searchVal || proj.BioProject.toLowerCase().includes(searchVal);
    return matchType && matchCountry && matchTissue && matchDisease && matchSearch;
  });

  const totalMatched = matchedProjects.length;
  const hasFilter = typeVal || countryVal || tissueVal || diseaseVal || searchVal;
  resultsCountSpan.textContent = hasFilter ? `Found ${totalMatched} project${totalMatched !== 1 ? 's' : ''}` : `Showing all ${totalMatched} projects`;
  return totalMatched;
}

function renderPage() {
  const start = (currentPage - 1) * pageSize;
  const end = start + pageSize;
  const pageProjects = matchedProjects.slice(start, end);
  renderProjects(pageProjects);

  totalPages = Math.max(1, Math.ceil(matchedProjects.length / pageSize));
  if (currentPage > totalPages) currentPage = totalPages;
  currentPageSpan.textContent = currentPage;
  totalPagesSpan.textContent = totalPages;
  jumpPageInput.value = currentPage;
  jumpPageInput.max = totalPages;

  firstPageBtn.disabled = currentPage === 1;
  prevPageBtn.disabled = currentPage === 1;
  nextPageBtn.disabled = currentPage === totalPages;
  lastPageBtn.disabled = currentPage === totalPages;
}

function goToPage(page) {
  page = Math.max(1, Math.min(page, totalPages));
  if (page === currentPage) return;
  currentPage = page;
  renderPage();
}

function filterAndPaginate() {
  filterProjects();
  currentPage = 1;
  renderPage();
}

function bindEvents() {
  typeFilter.addEventListener('change', filterAndPaginate);
  countryFilter.addEventListener('change', filterAndPaginate);
  tissueFilter.addEventListener('change', filterAndPaginate);
  diseaseFilter.addEventListener('change', filterAndPaginate);
  searchInput.addEventListener('input', filterAndPaginate);
  firstPageBtn.addEventListener('click', () => goToPage(1));
  prevPageBtn.addEventListener('click', () => goToPage(currentPage - 1));
  nextPageBtn.addEventListener('click', () => goToPage(currentPage + 1));
  lastPageBtn.addEventListener('click', () => goToPage(totalPages));
  jumpPageBtn.addEventListener('click', () => {
    let page = parseInt(jumpPageInput.value, 10);
    if (isNaN(page)) page = 1;
    goToPage(page);
  });
  jumpPageInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      let page = parseInt(jumpPageInput.value, 10);
      if (isNaN(page)) page = 1;
      goToPage(page);
    }
  });
}

// ✅ 关键：跳转并存储 project

  // GitHub API 获取最新 release
  fetch('https://api.github.com/repos/jiehua1995/hexo-theme-researcher/releases/latest')
    .then(res => res.json())
    .then(data => {
      if (data && data.tag_name) {
        const latestVersion = data.tag_name.replace(/^v/, '');
        if (latestVersion !== currentVersion) {
          updateMessageEl.style.display = 'inline';
          updateMessageEl.title = `Latest version: ${latestVersion}`;
        }
      }
    })
    .catch(err => console.error('Failed to fetch latest theme version:', err));
})();

<script>
  (function(){
    const backToTopBtn = document.getElementById('back_to_top');

    // 更新按钮颜色由daisyUI的btn自动管理，无需额外代码

    function toggleVisibility() {
      if(window.scrollY > 100) {
        backToTopBtn.classList.remove('opacity-0', 'pointer-events-none');
        backToTopBtn.classList.add('opacity-100', 'pointer-events-auto');
      } else {
        backToTopBtn.classList.remove('opacity-100', 'pointer-events-auto');
        backToTopBtn.classList.add('opacity-0', 'pointer-events-none');
      }
    }

    backToTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    backToTopBtn.addEventListener('keypress', (e) => {
      if(e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        backToTopBtn.click();
      }
    });

    window.addEventListener('scroll', toggleVisibility);

    // 页面加载时判断一下
    toggleVisibility();
  })();
</script>


  <!-- MathJax for mathematical formulas -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        processEnvironments: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'],
        ignoreHtmlClass: 'tex2jax_ignore',
        processHtmlClass: 'tex2jax_process'
      },
      startup: {
        ready: () => {
          MathJax.startup.defaultReady();
        },
        pageReady: () => {
          MathJax.startup.defaultPageReady().then(() => {
            // Clean up $$ delimiters after rendering
            setTimeout(() => {
              const walker = document.createTreeWalker(
                document.querySelector('.post-content') || document.body,
                NodeFilter.SHOW_TEXT,
                null,
                false
              );

              let textNode;
              const nodesToUpdate = [];

              while (textNode = walker.nextNode()) {
                if (textNode.nodeValue.includes('$$') &&
                    textNode.parentNode.querySelector('mjx-container[display="true"]')) {
                  nodesToUpdate.push(textNode);
                }
              }

              nodesToUpdate.forEach(node => {
                node.nodeValue = node.nodeValue.replace(/\$\$/g, '');
              });
            }, 100);
          });
        }
      }
    };
  </script>
